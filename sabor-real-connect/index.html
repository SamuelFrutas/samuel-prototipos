nd:var(--soft);color:var(--green);border-color:#cfe8d8}.items{overflow:auto}.personrow{padding:12px 13px;border:0;border-bottom:1px solid #f0f3f1;background:white;display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start}.personrow.active{background:#edf7f0;border-left:3px solid var(--green);padding-left:10px}.face{width:38px;height:38px;border-radius:50%;background:#e7efe9;color:#285b40;display:grid;place-items:center;font-weight:800;flex:none}.face.gold{background:#fff0d8;color:#94611c}.face.blue{background:#e8eff8;color:#45688f}.copy{min-width:0;flex:1}.copytop{display:flex;justify-content:space-between;gap:5px}.copytop b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copytop time{font-size:9px;color:#93a097;white-space:nowrap}.preview{font-size:10px;color:#79867e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0}.tag{display:inline-block;font-size:9px;padding:3px 7px;border-radius:20px;background:#f0f3f1;color:#64736a}.tag.wait{background:#fff4df;color:var(--amber)}.tag.work{background:#eaf2fb;color:var(--blue)}.tag.done{background:var(--soft);color:var(--green)}.unread{float:right;background:var(--green);color:white;border-radius:20px;padding:2px 5px;font-size:9px}.chat{display:flex;flex-direction:column;min-width:0;background:#f8faf8}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:25px}.empty strong{font-size:15px}.chathead{padding:12px 16px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.chatwho{display:flex;align-items:center;gap:10px;min-width:0}.chatwho b{display:block;font-size:12px}.chatwho small{font-size:10px;color:var(--muted)}.chathead select{max-width:150px;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:10px;background:white}.messages{padding:17px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:10px 12px;border-radius:12px;background:white;border:1px solid var(--line);font-size:11px;align-self:flex-start}.bubble.mine{align-self:flex-end;background:#e6f5e9;border-color:#d5ebdc}.bubble small{display:block;text-align:right;color:#9aa59e;font-size:9px;margin-top:4px}.compose{padding:11px;background:white;border-top:1px solid var(--line)}.tools{display:flex;gap:6px;margin-bottom:8px}.tools button{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 8px;color:#627168;font-size:10px}.sendrow{display:flex;gap:7px}.sendrow input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.sendrow button{border:0;border-radius:9px;background:var(--green);color:white;width:40px}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%}.table th,.table td{padding:13px 15px;text-align:left;border-bottom:1px solid #eef2ef;font-size:11px}.table th{font-size:9px;color:#849188;text-transform:uppercase;background:#fafcfb}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eef2ef;font-size:12px}.task input{accent-color:var(--green)}.task small{margin-left:auto;color:#89958d;font-size:10px}.quick{grid-template-columns:repeat(3,1fr)}.tile{padding:19px;text-align:left;background:white;border:1px solid var(--line);border-radius:14px}.tile strong{display:block;margin:9px 0 3px}.tile small{color:var(--muted)}.aihero{background:linear-gradient(135deg,#123b2b,#1b6245);color:white;border-radius:16px;padding:22px;margin-bottom:14px}.aihero h2{margin:8px 0 4px;font-size:20px}.aihero p{color:#c6e1d0;font-size:11px;margin:0}.aigrid{grid-template-columns:1fr 1fr}.aigrid textarea{width:100%;min-height:155px;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}.previewbox{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fbfdfb;min-height:155px}.previewbox li{font-size:11px;margin:7px 0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:#64736a;font-weight:700}.field input,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px}.modalback{display:none;position:fixed;inset:0;background:#0a1c13a6;z-index:10;place-items:center;padding:18px}.modalback.open{display:grid}.modal{width:min(500px,100%);background:white;border-radius:16px;padding:20px}.modal.order-modal{width:min(820px,100%);max-height:90vh;overflow:auto}.order-line{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:8px;align-items:center;margin:8px 0}.order-line input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.order-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.order-source{background:#f6faf7;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;font-size:11px;color:#65736b}.organize-btn{background:#176b4b!important;color:#fff!important;border-color:#176b4b!important;font-weight:800!important}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.toast{position:fixed;right:20px;bottom:20px;background:#173c2a;color:white;padding:12px 15px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1}.hamb{display:none}.back-chat{display:none;border:1px solid var(--line);background:white;border-radius:8px;padding:7px 10px;color:var(--green);font-weight:800;flex:none}
@media(max-width:1000px){.app{grid-template-columns:205px 1fr}.layout{grid-template-columns:285px 1fr}.page{padding:22px 18px}}
@media(max-width:740px){.back-chat{display:inline-flex;align-items:center;justify-content:center}.app{display:block}.side{position:fixed;z-index:8;left:-250px;top:0;bottom:0;width:238px;transition:left .2s}.side.open{left:0}.top{height:58px;padding:0 13px}.hamb{display:inline-block;border:1px solid var(--line);background:white;border-radius:8px;padding:7px 9px;margin-right:9px}.page{padding:18px 12px}.head h1{font-size:22px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.statvalue{font-size:23px}.dashgrid{grid-template-columns:1fr}.layout{height:calc(100dvh - 130px);min-height:470px;grid-template-columns:1fr}.layout.chatopen{grid-template-columns:1fr}.layout.chatopen .list{display:none}.layout:not(.chatopen) .chat{display:none}.quick{grid-template-columns:repeat(2,1fr)}.aigrid{grid-template-columns:1fr}.head .btn{font-size:10px;padding:9px}.user span{display:none}}

</style></head><body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">SR</div><div><b>Sabor Real</b><small>Connect · Central de conversas</small></div></div>
<div><div class="navlabel">Principal</div><nav class="nav"><button data-page="dashboard"><span>▦</span>Visão geral</button><button class="active" data-page="conversations"><span>◫</span>Conversas <i id="navcount">3</i></button><button data-page="quick"><span>ϟ</span>Ações rápidas</button></nav></div>
<div><div class="navlabel">Organização</div><nav class="nav"><button data-page="history"><span>◷</span>Histórico</button><button data-page="tasks"><span>☑</span>Tarefas</button><button data-page="orders"><span>▤</span>Encomendas</button></nav></div>
<div><div class="navlabel">Inteligência</div><nav class="nav"><button data-page="ai"><span>✧</span>Assistente IA</button><button data-page="voice"><span>◖</span>Voz</button></nav></div>
<div class="sidefoot"><span class="pill">● MODO DEMONSTRAÇÃO</span><p>Protótipo interativo. Dados salvos neste navegador.</p></div></aside>
<main class="main"><header class="top"><div><button class="hamb" id="hamb">☰</button><span class="crumb">Sabor Real Connect / <b id="crumb">Visão geral</b></span></div><div class="user"><div class="avatar">S</div><span>Samuel</span></div></header><div class="page" id="page"></div></main></div>
<div class="modalback" id="modal"><div class="modal"><div class="modalhead"><h3 id="mtitle">Adicionar</h3><button class="btn light" id="mclose">×</button></div><div id="mbody"></div></div></div><div class="toast" id="toast"></div>
<script>
const seed=[
{id:1,name:"Mariana Costa",phone:"(28) 99912-3040",initials:"MC",status:"wait",time:"09:42",preview:"Oi! Queria confirmar o pedido de amanhã.",unread:2,messages:[["in","Bom dia! Tudo bem?","09:31"],["out","Bom dia, Mariana! Tudo ótimo. Como posso ajudar?","09:34"],["in","Queria confirmar o pedido de amanhã.","09:42"]]},
{id:2,name:"Restaurante Sabor da Praia",phone:"(28) 99871-5520",initials:"SP",status:"work",time:"09:18",preview:"Pode separar mais 3 caixas de banana?",unread:1,messages:[["in","Bom dia, Samuel. Tudo certo?","09:05"],["out","Tudo sim! Pode mandar o pedido.","09:08"],["in","Pode separar mais 3 caixas de banana?","09:18"]]},
{id:3,name:"Carlos Henrique",phone:"(28) 99702-1188",initials:"CH",status:"wait",time:"Ontem",preview:"Obrigado, fico no aguardo.",unread:0,messages:[["in","Você tem água de coco de 500 ml?","Ontem"],["out","Temos sim!","Ontem"],["in","Obrigado, fico no aguardo.","Ontem"]]},
{id:4,name:"Pousada Mar Azul",phone:"(28) 99933-6102",initials:"MA",status:"done",time:"Ontem",preview:"Recebido certinho, obrigado!",unread:0,messages:[["in","Pedido recebido certinho, obrigado!","Ontem"],["out","Nós que agradecemos!","Ontem"]]},
{id:5,name:"Ana Paula",phone:"(28) 99802-4411",initials:"AP",status:"work",time:"Seg",preview:"Vou querer 2 melancias e 1 caixa de morango.",unread:0,messages:[["in","Vou querer 2 melancias e 1 caixa de morango.","Seg"],["out","Anotado, Ana!","Seg"]]}];
let data=readData(),page="conversations",chosen=1,filter="all",draft="",orderDraft=[];
function readData(){try{return JSON.parse(localStorage.getItem("sabor-connect-demo"))||{}}catch(e){return{}}}
let chats=data.chats||seed,tasks=data.tasks||[{id:1,text:"Confirmar entrega da Mariana",when:"Hoje · 10:30",done:false},{id:2,text:"Separar banana para Sabor da Praia",when:"Hoje · 11:00",done:false},{id:3,text:"Retornar ligação do fornecedor",when:"Hoje · 14:00",done:false},{id:4,text:"Conferir encomenda da Pousada",when:"Amanhã",done:true}],orders=data.orders||[{id:"#1048",customer:"Mariana Costa",items:"Banana, mamão e ovos caipira",status:"Aguardando confirmação",date:"Hoje"},{id:"#1047",customer:"Sabor da Praia",items:"3 caixas de banana",status:"Em separação",date:"Hoje"},{id:"#1046",customer:"Ana Paula",items:"2 melancias, 1 morango",status:"Finalizado",date:"Ontem"}];
function persist(){localStorage.setItem("sabor-connect-demo",JSON.stringify({chats:chats,tasks:tasks,orders:orders}))}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function notify(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function label(s){return s==="wait"?"Aguardando resposta":s==="work"?"Pedido em andamento":"Finalizado"}
function tag(s){return '<span class="tag '+s+'">'+label(s)+'</span>'}
function go(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));let names={dashboard:"Visão geral",conversations:"Conversas",quick:"Ações rápidas",history:"Histórico",tasks:"Tarefas",orders:"Encomendas",ai:"Assistente IA",voice:"Voz"};document.getElementById("crumb").textContent=names[p];document.getElementById("side").classList.remove("open");render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById("hamb").onclick=()=>document.getElementById("side").classList.toggle("open");
function header(k,t,s,action){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><div class="sub">'+s+'</div></div>'+(action||"")+'</div>'}
function dashboard(){let w=chats.filter(c=>c.status==="wait").length,p=chats.filter(c=>c.status==="work").length,d=chats.filter(c=>c.status==="done").length;return header("SEU NEGÓCIO EM UM SÓ LUGAR","Bom dia, Samuel 👋","Aqui está o resumo do atendimento do Hortifruti Sabor Real.",'<button class="btn primary" onclick="go(\'conversations\')">＋ Abrir conversas</button>')+'<div class="grid stats">'+[['Conversas abertas',w+p,'Aguardando ou em andamento'],['Aguardando resposta',w,'Precisam de atenção'],['Pedidos em andamento',p,'Em atendimento'],['Finalizados',d,'Conversas concluídas']].map(x=>'<div class="stat"><div class="statlabel">'+x[0]+'</div><div class="statvalue">'+x[1]+'</div><div class="statnote">'+x[2]+'</div></div>').join("")+'</div><div class="grid dashgrid"><section class="card"><h3>Visão das conversas</h3><div class="muted">Distribuição por situação</div>'+[['Aguardando resposta',w,'#d69a3d'],['Pedido em andamento',p,'#5b8fc0'],['Finalizados',d,'#3b9a6b']].map(x=>'<div class="barrow"><label>'+x[0]+'</label><div class="bar"><i style="width:'+Math.max(5,x[1]/Math.max(1,chats.length)*100)+'%;background:'+x[2]+'"></i></div><b>'+x[1]+'</b></div>').join("")+'<button class="btn soft" onclick="go(\'ai\')">✧ Organizar pedido com IA</button> <button class="btn light" onclick="newTask()">＋ Nova tarefa</button></section><section class="card"><h3>Atividade recente</h3><div class="muted">Movimentações de demonstração</div><div class="activity"><div>💬 <b>Mariana Costa enviou uma mensagem</b><small>Confirmação de pedido · 09:42</small></div><div>🧺 <b>Novo pedido em andamento</b><small>Sabor da Praia · 09:18</small></div><div>✓ <b>Atendimento finalizado</b><small>Pousada Mar Azul · Ontem</small></div></div></section></div>'}
function chatRows(q){return chats.filter(c=>(filter==="all"||filter===c.status)&&(!q||[c.name,c.phone,c.preview].join(" ").toLowerCase().includes(q.toLowerCase()))).map(c=>'<button class="personrow '+(chosen===c.id?'active':'')+'" onclick="selectChat('+c.id+')"><div class="face">'+esc(c.initials)+'</div><div class="copy"><div class="copytop"><b>'+esc(c.name)+'</b><time>'+esc(c.time)+'</time></div><div class="preview">'+esc(c.preview)+'</div>'+tag(c.status)+(c.unread?'<span class="unread">'+c.unread+'</span>':'')+'</div></button>').join("")||'<p class="muted" style="padding:20px">Nenhuma conversa encontrada.</p>'}
function chatView(){let c=chats.find(x=>x.id===chosen);if(!c)return '<div class="empty">Selecione uma conversa para ver o atendimento.</div>';return '<div class="chathead"><div class="chatwho"><button class="back-chat" onclick="backToChats()" aria-label="Voltar para conversas">←</button><div class="face">'+esc(c.initials)+'</div><div><b>'+esc(c.name)+'</b><small>'+esc(c.phone)+'</small></div></div><select onchange="changeStatus('+c.id+',this.value)"><option value="wait" '+(c.status==="wait"?'selected':'')+'>Aguardando resposta</option><option value="work" '+(c.status==="work"?'selected':'')+'>Pedido em andamento</option><option value="done" '+(c.status==="done"?'selected':'')+'>Finalizado</option></select></div><div class="messages">'+c.messages.map(m=>'<div class="bubble '+(m[0]==="out"?'mine':'')+'">'+esc(m[1])+'<small>'+esc(m[2])+'</small></div>').join("")+'</div><div class="compose"><div class="tools"><button class="organize-btn" onclick="openOrderOrganizer('+c.id+')">✧ Organizar pedido</button><button onclick="go(\'tasks\')">☑ Criar tarefa</button><button onclick="notify(\'Anexo de demonstração\')">＋ Anexar</button></div><div class="sendrow"><input id="message" placeholder="Digite uma mensagem..." onkeydown="if(event.key===\'Enter\')sendMessage()"><button onclick="sendMessage()">➤</button></div></div>'}
function conversations(){return header("ATENDIMENTO","Conversas","Organize seus clientes por situação e continue cada atendimento.",'<button class="btn primary" onclick="newChat()">＋ Nova conversa</button>')+'<div class="layout" id="layout"><div class="list"><div class="listhead"><h3>Todas as conversas ('+chats.length+')</h3><input id="search" class="search" placeholder="⌕ Buscar nome ou telefone..."><div class="filters">'+[['all','Todas'],['wait','Aguardando'],['work','Em andamento'],['done','Finalizadas']].map(x=>'<button class="filter '+(filter===x[0]?'active':'')+'" onclick="setFilter(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</div></div><div class="items" id="chatrows">'+chatRows("")+'</div></div><div class="chat" id="chatview">'+chatView()+'</div></div>'}
function backToChats(){document.getElementById("layout").classList.remove("chatopen")}
function selectChat(id){chosen=id;let c=chats.find(x=>x.id===id);c.unread=0;persist();document.getElementById("layout").classList.add("chatopen");document.getElementById("chatrows").innerHTML=chatRows(document.getElementById("search").value);document.getElementById("chatview").innerHTML=chatView();document.getElementById("navcount").textContent=chats.filter(x=>x.unread).length}
function setFilter(f){filter=f;document.getElementById("chatrows").innerHTML=chatRows(document.getElementById("search").value);document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.textContent.trim()==={all:"Todas",wait:"Aguardando",work:"Em andamento",done:"Finalizadas"}[f]))}
function changeStatus(id,s){let c=chats.find(x=>x.id===id);c.status=s;persist();document.getElementById("chatrows").innerHTML=chatRows(document.getElementById("search").value);notify("Situação atualizada")}
function sendMessage(){let i=document.getElementById("message"),c=chats.find(x=>x.id===chosen);if(!i.value.trim())return;let now=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});c.messages.push(["out",i.value.trim(),now]);c.preview=i.value.trim();c.time=now;persist();document.getElementById("chatview").innerHTML=chatView();notify("Mensagem adicionada à demonstração")}
function newChat(){modal("Nova conversa",'<div class="field"><label>Nome</label><input id="newname" placeholder="Nome do contato"></div><div class="field"><label>Telefone</label><input id="newphone" placeholder="(28) 99999-9999"></div><button class="btn primary" onclick="saveChat()">Criar conversa</button>')}
function saveChat(){let n=document.getElementById("newname").value.trim(),p=document.getElementById("newphone").value.trim();if(!n)return notify("Informe o nome");let id=Math.max(0,...chats.map(c=>c.id))+1;chats.unshift({id:id,name:n,phone:p,initials:n.split(" ").slice(0,2).map(x=>x[0]).join("").toUpperCase(),status:"wait",time:"Agora",preview:"Nova conversa",unread:0,messages:[]});chosen=id;persist();closeModal();render()}

function openOrderOrganizer(id){
 const c=chats.find(x=>x.id===id); if(!c)return;
 const source=c.messages.map(m=>m[1]).join("\n");
 const found=source.match(/\b\d+\s*(?:unidades?|un|d[uú]zias?|dz|caixas?|cx|bandejas?|kg)?\s*(?:de\s+)?[a-záàâãéêíóôõúç]+/gi)||[];
 orderDraft=found.map(x=>({name:x.replace(/^\d+\s*/,''),qty:(x.match(/^\d+/)||['1'])[0]}));
 if(!orderDraft.length)orderDraft=[{name:"",qty:"1"}];
 modal("Organizar pedido · "+c.name,'<p class="muted">Revise os itens identificados nas mensagens desta conversa. Edite, adicione ou remova produtos e quantidades antes de salvar.</p><div class="order-source"><b>Mensagens da conversa</b><br>'+esc(source).replace(/\n/g,"<br>")+'</div><b>Itens do pedido</b><div id="order-lines">'+orderDraft.map((x,i)=>orderLineHtml(x,i)).join("")+'</div><div class="order-actions"><button class="btn light" onclick="addOrderLine()">＋ Adicionar item</button><div><button class="btn light" onclick="closeModal()">Cancelar</button> <button class="btn primary" onclick="confirmOrganizedOrder('+id+')">Salvar encomenda</button></div></div>');
 document.querySelector("#modal .modal").classList.add("order-modal");
}
function orderLineHtml(x,i){return '<div class="order-line"><input id="ordername'+i+'" value="'+esc(x.name)+'" placeholder="Produto"><input id="orderqty'+i+'" value="'+esc(x.qty)+'" placeholder="Qtd."><button class="btn light" onclick="removeOrderLine('+i+')">×</button></div>'}
function collectOrderLines(){return orderDraft.map((x,i)=>({name:document.getElementById("ordername"+i)?.value.trim()||"",qty:document.getElementById("orderqty"+i)?.value.trim()||"1"}))}
function addOrderLine(){orderDraft=collectOrderLines();orderDraft.push({name:"",qty:"1"});document.getElementById("order-lines").innerHTML=orderDraft.map(orderLineHtml).join("")}
function removeOrderLine(i){orderDraft=collectOrderLines();orderDraft.splice(i,1);if(!orderDraft.length)orderDraft.push({name:"",qty:"1"});document.getElementById("order-lines").innerHTML=orderDraft.map(orderLineHtml).join("")}
function confirmOrganizedOrder(id){const lines=collectOrderLines().filter(x=>x.name);if(!lines.length)return notify("Adicione pelo menos um produto");const c=chats.find(x=>x.id===id);orders.unshift({id:"#"+(1049+orders.length),customer:c.name,items:lines.map(x=>x.qty+" "+x.name).join(", "),status:"Aguardando confirmação",date:"Hoje"});persist();closeModal();notify("Pedido organizado e salvo em Encomendas")}

function quick(){return header("ATALHOS","Ações rápidas","Comece uma atividade comum sem procurar por menus.")+'<div class="grid quick">'+[['💬','Abrir conversas','Continue um atendimento.','conversations'],['✧','Organizar pedido','Transforme mensagens em lista.','ai'],['☑','Criar tarefa','Registre um lembrete.','tasks'],['🧺','Ver encomendas','Acompanhe pedidos recebidos.','orders'],['◷','Histórico','Consulte atendimentos anteriores.','history'],['🎙','Captura por voz','Registre uma nota falada.','voice']].map(x=>'<button class="tile" onclick="'+(x[3]==="tasks"?'newTask()':'go(\''+x[3]+'\')')+'"><span style="font-size:22px">'+x[0]+'</span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></button>').join("")+'</div>'}
function history(){return header("REGISTROS","Histórico","Consulte os atendimentos e retome o contexto quando precisar.")+'<section class="card tablewrap"><table class="table"><thead><tr><th>Contato</th><th>Última mensagem</th><th>Situação</th><th>Data</th></tr></thead><tbody>'+chats.filter(c=>c.status==="done").map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.preview)+'</td><td>'+tag(c.status)+'</td><td>'+esc(c.time)+'</td></tr>').join("")+'</tbody></table></section>'}
function taskPage(){return header("ORGANIZAÇÃO","Tarefas","Lembretes e próximos passos do atendimento.",'<button class="btn primary" onclick="newTask()">＋ Nova tarefa</button>')+'<section class="card"><h3>Minha lista</h3><div class="muted">'+tasks.filter(t=>!t.done).length+' tarefas pendentes</div>'+tasks.map(t=>'<label class="task"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask('+t.id+')"><span style="'+(t.done?'text-decoration:line-through;color:#9aa69e':'')+'">'+esc(t.text)+'</span><small>'+esc(t.when)+'</small></label>').join("")+'</section>'}
function newTask(){modal("Nova tarefa",'<div class="field"><label>O que precisa ser feito?</label><input id="tasktext" placeholder="Ex.: Confirmar pedido com cliente"></div><div class="field"><label>Quando?</label><input id="taskwhen" placeholder="Ex.: Hoje às 15:00"></div><button class="btn primary" onclick="saveTask()">Salvar tarefa</button>')}
function saveTask(){let t=document.getElementById("tasktext").value.trim(),w=document.getElementById("taskwhen").value.trim()||"Sem data";if(!t)return notify("Descreva a tarefa");tasks.unshift({id:Math.max(0,...tasks.map(x=>x.id))+1,text:t,when:w,done:false});persist();closeModal();render();notify("Tarefa salva")}
function toggleTask(id){let t=tasks.find(x=>x.id===id);t.done=!t.done;persist();render()}
function orderPage(){return header("PEDIDOS","Encomendas","Pedidos identificados durante os atendimentos.",'<button class="btn primary" onclick="newOrder()">＋ Nova encomenda</button>')+'<section class="card tablewrap"><table class="table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Itens</th><th>Situação</th><th>Data</th></tr></thead><tbody>'+orders.map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+esc(o.customer)+'</td><td>'+esc(o.items)+'</td><td>'+esc(o.status)+'</td><td>'+o.date+'</td></tr>').join("")+'</tbody></table></section>'}
function newOrder(){modal("Nova encomenda",'<div class="field"><label>Cliente</label><input id="ocustomer"></div><div class="field"><label>Itens do pedido</label><textarea id="oitems"></textarea></div><button class="btn primary" onclick="saveOrder()">Salvar encomenda</button>')}
function saveOrder(){let c=document.getElementById("ocustomer").value.trim(),i=document.getElementById("oitems").value.trim();if(!c||!i)return notify("Preencha cliente e itens");orders.unshift({id:"#"+(1049+orders.length),customer:c,items:i,status:"Aguardando confirmação",date:"Hoje"});persist();closeModal();render()}
function aiPage(){return header("ASSISTENTE","Organizar pedido com IA","Cole a conversa ou anote o que o cliente pediu. Revise antes de confirmar.")+'<div class="aihero"><div style="font-size:22px">✧</div><h2>Do texto bagunçado para um pedido organizado.</h2><p>O protótipo simula a organização automática. Você continua no controle e edita tudo antes de confirmar.</p></div><div class="grid aigrid"><section class="card"><h3>1. Mensagem recebida</h3><p class="muted">Cole aqui o texto do cliente</p><textarea id="aitext" placeholder="Ex.: Bom dia! Separa 2 melancias, 3 dúzias de banana e uma bandeja de morango...">'+esc(draft)+'</textarea><button class="btn primary" style="margin-top:10px" onclick="organize()">✧ Organizar pedido</button></section><section class="card"><h3>2. Prévia do pedido</h3><p class="muted">Confira e edite antes de confirmar</p><div class="previewbox" id="previewbox">A lista organizada aparecerá aqui.</div><button class="btn soft" style="margin-top:10px" onclick="saveAiOrder()">Salvar como encomenda</button></section></div>'}
function organize(){let text=document.getElementById("aitext").value.trim();draft=text;if(!text)return notify("Cole uma mensagem primeiro");let matches=text.match(/\b\d+\s*(?:unidades?|un|d[uú]zias?|dz|caixas?|cx|bandejas?|kg)?\s*(?:de\s+)?[a-záàâãéêíóôõúç]+/gi)||[text];document.getElementById("previewbox").innerHTML="<h3>Pedido identificado</h3><ul>"+matches.map(x=>'<li contenteditable="true">'+esc(x)+'</li>').join("")+'</ul><small class="muted">Toque nos itens para editar. Organização simulada no protótipo.</small>';notify("Pedido pronto para revisão")}
function saveAiOrder(){let lis=document.querySelectorAll("#previewbox li");if(!lis.length)return notify("Organize um pedido primeiro");orders.unshift({id:"#"+(1049+orders.length),customer:"Cliente a identificar",items:Array.from(lis).map(x=>x.textContent).join(", "),status:"Aguardando confirmação",date:"Hoje"});persist();go("orders");notify("Encomenda salva")}
function voicePage(){return header("CAPTURA RÁPIDA","Voz","Registre uma ideia ou informação sem interromper seu trabalho.")+'<section class="card" style="max-width:680px;text-align:center;padding:34px 18px"><div style="font-size:32px">🎙</div><h2>Fale sua anotação</h2><p class="muted">O reconhecimento usa o recurso do navegador quando disponível.</p><button class="btn primary" onclick="startVoice()">● Iniciar gravação</button><div class="field" style="text-align:left"><label>Texto reconhecido / anotação</label><textarea id="voicetext" style="width:100%;min-height:100px" placeholder="Sua anotação aparecerá aqui..."></textarea></div><button class="btn soft" onclick="voiceTask()">Salvar como tarefa</button><p class="muted" id="voicestatus">Pronto para ouvir.</p></section>'}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return notify("Reconhecimento de voz não disponível neste navegador");let r=new SR();r.lang="pt-BR";r.continuous=true;r.interimResults=true;r.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+" ";document.getElementById("voicetext").value=s};r.onstart=()=>document.getElementById("voicestatus").textContent="Ouvindo…";r.onend=()=>document.getElementById("voicestatus").textContent="Captura encerrada.";r.start()}
function voiceTask(){let t=document.getElementById("voicetext").value.trim();if(!t)return notify("Nenhuma anotação");tasks.unshift({id:Math.max(0,...tasks.map(x=>x.id))+1,text:t,when:"Anotação por voz",done:false});persist();notify("Anotação salva como tarefa")}
function modal(t,b){document.getElementById("mtitle").textContent=t;document.getElementById("mbody").innerHTML=b;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");document.querySelector("#modal .modal").classList.remove("order-modal")}document.getElementById("mclose").onclick=closeModal;document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function render(){let pages={dashboard:dashboard,conversations:conversations,quick:quick,history:history,tasks:taskPage,orders:orderPage,ai:aiPage,voice:voicePage};document.getElementById("page").innerHTML=pages[page]();document.getElementById("navcount").textContent=chats.filter(c=>c.unread).length;let s=document.getElementById("search");if(s)s.oninput=()=>document.getElementById("chatrows").innerHTML=chatRows(s.value)}
render();
</script></body></html>
